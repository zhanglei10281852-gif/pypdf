rubrics:
  - id: 1
    type: f2p
    text: append 与 merge 的非空前缀按源命名目标原名逐字拼接，普通名称、非 ASCII 名称及旧式 /Dests 来源均可导入；在选页和中间插入后，新名称只指向本次选中的目标页，保留 Fit 模式与参数，写出再读结果一致。
  - id: 2
    type: f2p
    text: 前缀模式下，导入页面的命名 /Dest 与 /A /GoTo /D 均引用本次新名称；源未定义或目标页未选中的命名页面链接被过滤，即使输出已有同名目标也不误接到其他来源。
  - id: 3
    type: f2p
    text: 导入书签的命名 GoTo 动作使用与本次目标表一致的新名称，指向本次导入页，显示标题、父子层级和目标视图保持，写出再读后仍可正确解析。
  - id: 4
    type: f2p
    text: 同一 Reader 无需重建或手动重置即可用不同前缀连续导入，命名导航分别指向各自副本；页面与书签共享动作时也不会串改先前副本或源 Reader 的名称、链接、书签，写出再读仍成立。
  - id: 5
    type: f2p
    text: 非空前缀产生的有效导入名称与输出已有命名目标冲突时，抛出包含冲突名称的 ValueError，不覆盖、跳过或自动改名，页数、名称、书签与既有链接保持失败前状态，换前缀后可在同一 Writer 重试并写出正确导航。
  - id: 6
    type: p2p
    text: 省略前缀、传 None 或空字符串时保持原合并行为和同名处理规则，既有 append/merge 位置参数、页面选择及插入调用方式继续可用，不强制调用方改变旧代码。
  - id: 7
    type: p2p
    text: 启用前缀后，单次导入中原本可达的显式页面数组链接、URI 与远程跳转仍保持含义，import_outline=False 不导入书签，排除 /Annots 时不重新添加注释。
